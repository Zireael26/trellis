# Anti-slop Python profile — mypy fragment: type-flow rules.
#
# Ownership split (plan 037 D3): mypy owns rules that need to follow a type through
# the program; ruff owns per-line pattern rules. No rule is enabled in both fragments.
# Read README.md § Ownership before adding to either set.
#
# This is a fragment, not a config. Merge these keys into the project's existing
# `[mypy]` section — README.md § Install, which also covers the `enable_error_code`
# merge (it is a list, so it appends rather than replaces).

[mypy]
# Unparsed boundary data laundered into a typed contract: the signature promises `str`,
# the returned value is `Any`. Needs type flow to see, so no linter can report it.
warn_return_any = True

# An unannotated def has no contract, so every check above it goes quiet — including
# ruff's ANN401, which has no annotation left to inspect.
disallow_untyped_defs = True

# A suppression must name what it suppresses. This owns the bare `# type: ignore` line
# for the whole profile; ruff's PGH003 is left out of ruff-fragment.toml to match.
enable_error_code = ignore-without-code

# Deliberately NOT set: disallow_any_explicit. It reports every explicit `Any`
# annotation that ANN401 already reports — precisely the double-report D3 exists to
# prevent. Consequence: nested `Any` (`dict[str, Any]`) escapes both fragments.
# README.md § Known gaps states why that is accepted rather than patched.

# Test carve-out. `disallow_untyped_defs` reports every unannotated test function, so
# without this an ordinary `def test_parses_user():` is a finding — the warning-fatigue
# failure this profile is designed around (spec 037 §2). The two pattern rules stay on
# in tests: an `Any` contract or an unnamed suppression is worth reporting there too.
#
# Star must be a whole component — mypy rejects `test_*` with "Patterns must be
# fully-qualified module names" (measured), so bare `test_*.py` modules outside a
# `tests/` package are not covered here. README.md § Install step 4 has the `exclude`
# regex for that layout.
[mypy-conftest,*.conftest,tests.*,*.tests.*]
disallow_untyped_defs = False
